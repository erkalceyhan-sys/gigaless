name: gigaless
description: "Gigaless - Smart Swipe Photo & Storage Declutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  photo_manager: ^3.1.4
  photo_manager_image_provider: ^2.0.1
  shared_preferences: ^2.3.2
  google_mobile_ads: ^5.1.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
