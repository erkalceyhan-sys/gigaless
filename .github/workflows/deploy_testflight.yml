name: Build & Deploy iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  deploy_ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build iOS No-Codesign
        run: |
          cd app
          flutter build ios --release --no-codesign
